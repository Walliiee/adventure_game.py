<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wildlands — 3D Character</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { overflow: hidden; background: #1a1a2e; }
      #canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
      #ui {
        position: fixed;
        top: 0; left: 0; right: 0;
        padding: 0.75rem 1rem;
        background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
        color: #eee;
        font-family: "Segoe UI", sans-serif;
        font-size: 0.9rem;
        pointer-events: none;
        z-index: 10;
      }
      #ui kbd { background: rgba(255,255,255,0.2); padding: 0.15rem 0.4rem; border-radius: 4px; }
      #hud {
        position: fixed;
        top: 3.8rem;
        left: 1rem;
        right: 1rem;
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        z-index: 11;
        pointer-events: none;
        color: #f4f6ff;
        font-family: "Segoe UI", sans-serif;
      }
      .hud-card {
        background: rgba(16, 20, 33, 0.86);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 10px;
        padding: 0.6rem 0.75rem;
        min-width: 220px;
      }
      .hud-title { font-size: 0.75rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.04em; }
      .hud-main { margin-top: 0.25rem; font-size: 0.95rem; }
      #toast {
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(9, 14, 24, 0.9);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 8px;
        padding: 0.55rem 0.9rem;
        font-family: "Segoe UI", sans-serif;
        z-index: 21;
        display: none;
      }
      #interaction-panel,
      #design-panel {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(30, 35, 50, 0.98);
        color: #eee;
        padding: 1.25rem;
        border-radius: 12px;
        font-family: "Segoe UI", sans-serif;
        box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        z-index: 20;
        pointer-events: auto;
        min-width: 260px;
        max-width: min(90vw, 460px);
      }
      #interaction-panel.hidden,
      #design-panel.hidden { display: none; }
      #interaction-panel h3,
      #design-panel h3 { margin-bottom: 0.75rem; font-size: 1rem; }
      #interaction-question { line-height: 1.35; margin-bottom: 0.65rem; }
      .answer-btn,
      #design-panel .btn {
        display: block;
        width: 100%;
        text-align: left;
        margin-top: 0.45rem;
        border: none;
        border-radius: 8px;
        padding: 0.55rem 0.7rem;
        cursor: pointer;
      }
      .answer-btn { background: #31445a; color: #eef4ff; }
      .answer-btn:hover { background: #3b5471; }
      #design-panel label { display: block; margin-top: 0.5rem; font-size: 0.85rem; }
      #design-panel input[type="color"] { width: 100%; height: 36px; margin-top: 0.25rem; border: none; border-radius: 8px; cursor: pointer; }
      #design-panel input[type="range"] { width: 100%; margin-top: 0.25rem; }
      #design-panel .btn { margin-top: 1rem; background: #2f9e44; color: white; font-size: 0.95rem; }
      #design-panel .btn:hover { background: #268836; }
    </style>
  </head>
  <body>
    <div id="ui">
      Click to play · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · Mouse to look · <kbd>E</kbd> interact · <kbd>C</kbd> design · <kbd>Esc</kbd> release mouse
    </div>

    <div id="hud">
      <div class="hud-card">
        <div class="hud-title">Objective</div>
        <div class="hud-main" id="objectiveText">Find Teacher and answer one Smarts question.</div>
      </div>
      <div class="hud-card">
        <div class="hud-title">Prompt</div>
        <div class="hud-main" id="promptText">Move toward the blue marker.</div>
      </div>
    </div>

    <div id="toast"></div>

    <div id="interaction-panel" class="hidden">
      <h3 id="interaction-title">Teacher Session</h3>
      <p id="interaction-question">Question text</p>
      <div id="interaction-answers"></div>
    </div>

    <div id="design-panel" class="hidden">
      <h3>Design your character</h3>
      <label>Body color</label>
      <input type="color" id="colorPicker" value="#4a9fd4" />
      <label>Height <span id="heightValue">1.0</span></label>
      <input type="range" id="heightSlider" min="0.7" max="1.4" step="0.05" value="1" />
      <button class="btn" id="designDone">Done</button>
    </div>
    <canvas id="canvas"></canvas>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    <script type="module" src="character3d.js"></script>
  </body>
</html>
